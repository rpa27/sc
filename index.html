<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f5fc8">
<title>출품영업팀 스케줄</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#f3f5f8;--card:#ffffff;--fg:#18202e;--mute:#667085;--faint:#98a2b3;--line:#e3e7ee;--soft:#eef1f6;
  --accent:#1f5fc8;--accentbg:#e8f0fd;--accentfg:#ffffff;--danger:#c0392b;
  --land:#e6ebf2;--landline:#ffffff;--sea:#f7f9fc;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --c0:#475467;--c1:#2f6fe4;--c2:#e4572e;--c3:#139c8e;--c4:#8b5cf6;--c5:#e09400;--c6:#d6336c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141c;--card:#181f2a;--fg:#e8ecf2;--mute:#9aa5b8;--faint:#6b778a;--line:#2a3342;--soft:#202938;
  --accent:#6ea0ff;--accentbg:#1c2b48;--accentfg:#0f141c;--danger:#ff7b6b;
  --land:#253043;--landline:#0f141c;--sea:#131a24;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --c0:#c3ccda;--c1:#6ea0ff;--c2:#ff8462;--c3:#3fd0bf;--c4:#b49bff;--c5:#ffc04d;--c6:#ff6fa0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c;--card:#181f2a;--fg:#e8ecf2;--mute:#9aa5b8;--faint:#6b778a;--line:#2a3342;--soft:#202938;
  --accent:#6ea0ff;--accentbg:#1c2b48;--accentfg:#0f141c;--danger:#ff7b6b;
  --land:#253043;--landline:#0f141c;--sea:#131a24;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --c0:#c3ccda;--c1:#6ea0ff;--c2:#ff8462;--c3:#3fd0bf;--c4:#b49bff;--c5:#ffc04d;--c6:#ff6fa0;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em}
header.top .hsub{color:var(--mute);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mute)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.sync.ok i{background:#22a06b}.sync.warn i{background:#e09400}.sync.err i{background:var(--danger)}

/* org chart */
.org{padding:16px;display:flex;flex-direction:column;align-items:center}
.lead{background:var(--fg);color:var(--bg);border-radius:12px;padding:9px 26px;font-weight:800;text-align:center;font-size:15px;transition:transform .12s}
.lead:active{transform:scale(.97)}
.lead small{display:block;font-weight:500;font-size:12px;opacity:.75}
.lead .st{display:block;margin-top:3px;font-size:11.5px;font-weight:700;opacity:.95}
.lead .st.no{opacity:.55;font-weight:500}
.stem{width:2px;height:14px;background:var(--line)}
.members{position:relative;width:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding-top:14px}
.members:before{content:"";position:absolute;top:0;left:8.33%;right:8.33%;height:2px;background:var(--line)}
.mem{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:10px 6px 9px;text-align:center;background:var(--card);transition:transform .12s,border-color .12s}
.mem:before{content:"";position:absolute;top:-15px;left:50%;width:2px;height:14px;background:var(--line)}
.mem:active{transform:scale(.97)}
.mem .nm{font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.mem .nm i{width:9px;height:9px;border-radius:50%;background:var(--mc)}
.mem .rk{font-size:12px;color:var(--mute)}
.mem .st{margin-top:5px;font-size:11.5px;font-weight:600;color:var(--mc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .st.no{color:var(--faint);font-weight:500}
.mem.done{border-color:var(--mc)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.cal{padding:14px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .ttl{font-size:18px;font-weight:800;padding:6px 10px;border-radius:10px}
.calhead .ttl:hover{background:var(--soft)}
.nav{display:flex;gap:6px}
.icon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--soft);font-size:18px;font-weight:700}
.todayb{padding:0 12px;width:auto;font-size:13px}
.wk,.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wk div{text-align:center;font-size:12px;font-weight:700;color:var(--mute);padding:4px 0}
.day{min-height:64px;border-radius:12px;border:1.5px solid transparent;background:var(--soft);padding:7px 7px 6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:background .12s,border-color .12s}
.day .n{font-weight:700;font-size:14px}
.day.out{opacity:.35}
.day.today .n{color:var(--accent)}
.day.today{border-color:var(--accent)}
.day.sel{background:var(--accent);border-color:var(--accent)}
.day.sel .n,.day.sel .cnt{color:var(--accentfg)}
.dots{display:flex;flex-wrap:wrap;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mc)}
.day.sel .dots i{box-shadow:0 0 0 1.5px var(--accentfg)}
.cnt{font-size:10.5px;color:var(--mute);font-weight:600}
.mp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mp button{padding:14px 0;border-radius:12px;background:var(--soft);font-weight:700}
.mp button.on{background:var(--accent);color:var(--accentfg)}

.daypanel{padding:14px}
.dph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dph b{font-size:16px;font-weight:800}
.dph span{font-size:13px;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:12px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line);border-radius:0}
.row:hover{background:var(--soft)}
.av{flex:0 0 36px;height:36px;border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.rb{flex:1;min-width:0}
.rb .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rb .l1 b{font-weight:800}
.tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--mute)}
.tag.new{background:var(--accentbg);color:var(--accent)}
.rb .l3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--faint);white-space:pre-line;margin-top:2px}
.rb .l2{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.go.no{color:var(--faint)}

/* map */
.mapcard{padding:14px;position:sticky;top:12px}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.maphead b{font-size:16px;font-weight:800}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.mapbox{background:var(--sea);border-radius:12px;overflow:hidden}
#map{display:block;width:100%;height:auto;max-height:76vh}
#map path{fill:var(--land);stroke:var(--landline);stroke-width:1.2;vector-effect:non-scaling-stroke}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.75}100%{transform:scale(2.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.25}}
.mk text{font-family:inherit;font-weight:800;paint-order:stroke;stroke:var(--card);stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--mc)}
.empty{color:var(--faint);font-size:13px;text-align:center;padding:6px 0 2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.sheet{visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:540px;border-radius:20px;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s;max-height:88vh}.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto;transition:transform .2s,opacity .2s}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
@media (min-width:760px){.grab{display:none}}
.sh{display:flex;align-items:center;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh .tt{flex:1;min-width:0}
.sh .tt b{font-size:17px;font-weight:800;display:block}
.sh .tt span{font-size:12.5px;color:var(--mute)}
.sb{overflow-y:auto;padding:16px max(18px,env(safe-area-inset-right,0px)) 8px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;overscroll-behavior:contain}
.fl{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}
.fl em{font-style:normal;font-weight:500;color:var(--faint)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbox{border:1.5px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.tbox .lb{font-size:12px;color:var(--mute);font-weight:700}
.tbox .tv{font-size:22px;font-weight:800;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.tbox .tv small{font-size:13px;font-weight:700;color:var(--mute);margin-right:4px}
.stp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stp button{height:40px;border-radius:10px;background:var(--soft);font-weight:800;font-size:13px}
.stp button:active{background:var(--accentbg)}
.chips{display:grid;gap:8px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.chip{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:14.5px;padding:8px 6px;transition:all .12s}
.chip.big{min-height:60px;font-size:16px}
.chip.big small{display:block;font-size:11.5px;font-weight:500;color:var(--mute)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accentfg)}
.chip.on small{color:var(--accentfg);opacity:.85}
.sub{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--soft);animation:drop .18s ease-out}
.sub .chip{background:var(--card)}
.sub .chip.on{background:var(--accent)}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;text-align:left}
.sw .tg{flex:0 0 46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw .tg:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on .tg{background:var(--accent)}.sw.on .tg:after{transform:translateX(18px)}
.pblock{display:flex;flex-direction:column;gap:8px}
.hb{display:inline-block;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:6px;background:var(--accentbg);color:var(--accent);margin-right:6px}
.mm{transition:transform .9s cubic-bezier(.45,0,.2,1)}
.trail{fill:none;stroke-dasharray:4 4;opacity:.55}
.notice{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--accentbg);color:var(--accent);font-size:13px;font-weight:700}
.notice.ro{background:var(--soft);color:var(--mute)}
.sb.ro .chips,.sb.ro .stp,.sb.ro .sw{pointer-events:none}
.sb.ro .chip:not(.on),.sb.ro .stp,.sb.ro .sw{opacity:.45}
.sfnote{flex:1;text-align:center;font-size:13.5px;font-weight:700;color:var(--mute);padding:14px 0}
.pin{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:17px;letter-spacing:.2em;background:var(--card);color:var(--fg)}
.pin:focus{outline:none;border-color:var(--accent)}
.pin::placeholder{letter-spacing:0;color:var(--faint);font-size:15px}
#pinOpen:empty{display:none}
.pinhint{font-size:12px;color:var(--faint);margin-top:6px}
.crumb{font-size:12.5px;color:var(--accent);font-weight:700}
textarea{width:100%;min-height:110px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:15px;line-height:1.55;background:var(--card);color:var(--fg)}
textarea::placeholder{color:var(--faint)}
textarea:focus{outline:none;border-color:var(--accent)}
.ctr{text-align:right;font-size:12px;color:var(--faint);margin-top:4px}
.sf{padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.save{flex:1;height:52px;border-radius:14px;background:var(--accent);color:var(--accentfg);font-weight:800;font-size:16px}
.save:disabled{opacity:.4;cursor:not-allowed}
.del{height:52px;padding:0 16px;border-radius:14px;background:var(--soft);color:var(--danger);font-weight:700}
.hint{font-size:12px;color:var(--faint);text-align:center;margin-top:-4px}
.lockb{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--mute)}
.lockb.on{background:var(--accentbg);color:var(--accent)}
.unl{display:flex;gap:8px;margin:4px 0 10px;animation:drop .18s ease-out}
.unl input{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:var(--card);color:var(--fg)}
.unl input:focus{outline:none;border-color:var(--accent)}
.unl button{height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--accentfg);font-weight:800}
.unl .err{border-color:var(--danger)}
.lockmsg{font-size:12.5px;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lockmsg button{color:var(--accent);font-weight:700;font-size:12.5px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:13.5px;opacity:0;transition:all .2s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.mapcard{position:static}}
@media (max-width:640px){
  .members{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:0}
  .members:before,.mem:before{display:none}
  .stem{height:10px;background:transparent}
  .day{min-height:56px;padding:6px 5px}
  .dots i{width:6px;height:6px}
  header.top h1{font-size:18px}
}
</style>
</head><body>


<div class="wrap">
  <header class="top">
    <div><h1>출품영업팀 스케줄</h1><div class="hsub">월~금 데일리 · 날짜를 누르면 그날 일정과 위치가 보여요</div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="pill" id="todayPill"></span><span class="sync" id="sync"><i></i><span>연결 확인 중</span></span></div>
  </header>

  <section class="card org">
    <button class="lead" id="leadCard" data-m="hw"></button>
    <div class="stem"></div>
    <div class="members" id="members"></div>
  </section>

  <div class="main">
    <div class="col">
      <section class="card cal">
        <div class="calhead">
          <button class="ttl" id="calTitle" aria-label="월 선택"></button>
          <div class="nav">
            <button class="icon todayb" id="goToday">오늘</button>
            <button class="icon" id="prev" aria-label="이전 달">‹</button>
            <button class="icon" id="next" aria-label="다음 달">›</button>
          </div>
        </div>
        <div id="calBody"></div>
      </section>
      <section class="card daypanel">
        <div class="dph"><b id="dpTitle"></b><span style="display:flex;gap:8px;align-items:center"><span id="dpCount"></span><button class="lockb" id="lockBtn"></button></span></div>
        <div id="dpUnlock"></div>
        <div id="dpList"></div>
      </section>
    </div>

    <section class="card mapcard">
      <div class="maphead">
        <b id="mapTitle">위치 현황</b>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><div class="seg" id="halfSeg"><button data-h="am" class="on">오전</button><button data-h="pm">오후</button></div><div class="seg" id="zoomSeg"><button data-z="kr" class="on">전국</button><button data-z="cap">수도권</button></div></div>
      </div>
      <div class="mapbox"><svg id="map" role="img" aria-label="팀원 위치 지도"></svg></div>
      <div class="legend" id="legend"></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shName">
  <div class="grab"></div>
  <div class="sh">
    <div class="av" id="shAv"></div>
    <div class="tt"><b id="shName"></b><span id="shDate"></span></div>
    <button class="icon" id="shClose" aria-label="닫기">✕</button>
  </div>
  <div class="sb" id="shBody">
    <div class="notice" id="shNotice" hidden></div>
    <div id="pinOpen"></div>
    <div>
      <div class="fl">근무 시간 <em>15분 단위</em></div>
      <div class="times">
        <div class="tbox"><div class="lb">출근</div><div class="tv" id="tvIn"></div><div class="stp"><button data-t="in" data-d="-15">− 15분</button><button data-t="in" data-d="15">+ 15분</button></div></div>
        <div class="tbox"><div class="lb">퇴근</div><div class="tv" id="tvOut"></div><div class="stp"><button data-t="out" data-d="-15">− 15분</button><button data-t="out" data-d="15">+ 15분</button></div></div>
      </div>
    </div>
    <div>
      <div class="fl">영업구분</div>
      <div class="chips c2" id="fType"></div>

// map
function proj([lon,lat]){return [(lon-GEO.L0)*GEO.K*GEO.sx,(GEO.B1-lat)*GEO.sx]}
const VB={kr:[0,0,GEO.w,GEO.h]};
(function(){const a=proj([126.45,37.98]),b=proj([127.75,36.72]);VB.cap=[a[0],a[1],b[0]-a[0],b[1]-a[1]]})();
function renderMap(animate){
  const svg=$('#map');const vb=VB[zoom];svg.setAttribute('viewBox',vb.join(' '));
  const s=vb[2]/600*Math.max(1,Math.min(1.8,520/(svg.clientWidth||520))); // 화면이 작으면 글자 키움
  let h=GEO.p.map(([n,d])=>`<path d="${d}"><title>${n}</title></path>`).join('');
  const day=DB.days[sel]||{};
  const on=MEMBERS.filter(m=>day[m.id]&&COORD[locKey(day[m.id])]);
  // 오전→오후 이동 경로(점선)
  on.forEach(m=>{const e=day[m.id];if(!moved(e)||!COORD[locKey(e.pm)])return;const a=proj(COORD[locKey(e)]),b=proj(COORD[locKey(e.pm)]);
    h+=`<line class="trail" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${css(m.c)}" stroke-width="${2*s}"/>`});
  const groups={};
  on.forEach(m=>{const o=half==='pm'?pmOf(day[m.id]):day[m.id];const k=locKey(o);if(!COORD[k])return;(groups[k]=groups[k]||[]).push(m)});
  const pos={};const r=9*s,fs=15*s,lh=19*s;
  for(const k in groups){const [x,y]=proj(COORD[k]);const ms=groups[k];
    ms.forEach((m,i)=>{pos[m.id]=[x,y];const col=css(m.c);const ty=(i-(ms.length-1)/2)*lh;
      h+=`<g class="mk mm" data-m="${m.id}" style="transform:translate(${x}px,${y}px)">`+(i===0?`<circle class="pulse" r="${r*1.6}" fill="${col}"/>`:'')+`<circle r="${r*.62}" fill="${col}" stroke="${css('--card')}" stroke-width="${2.2*s}"/><text x="${r*1.3}" y="${ty}" dy=".35em" font-size="${fs}" fill="${col}" stroke-width="${3.5*s}">${m.name}${moved(day[m.id])?(half==='am'?' ↗':' ✓'):''}</text>`+(i===ms.length-1?`<text x="${r*1.3}" y="${ty+lh-2*s}" dy=".35em" font-size="${fs*.72}" fill="${css('--mute')}" stroke-width="${3*s}" font-weight="600">${k}</text>`:'')+`</g>`;
    })}
  svg.innerHTML=h;
  if(animate){ // 이전 위치에서 새 위치로 이동
    const gs=[...svg.querySelectorAll('.mm')];
    gs.forEach(g=>{const p=lastPos[g.dataset.m],q=pos[g.dataset.m];if(p&&q&&(p[0]!==q[0]||p[1]!==q[1])){g.style.transition='none';g.style.transform=`translate(${p[0]}px,${p[1]}px)`}});
    svg.getBoundingClientRect();
    requestAnimationFrame(()=>gs.forEach(g=>{const q=pos[g.dataset.m];g.style.transition='';g.style.transform=`translate(${q[0]}px,${q[1]}px)`}));
  }
  lastPos=pos;
  const mv=on.filter(m=>moved(day[m.id])).length;
  $('#mapTitle').textContent=dayLabel(sel)+' '+(half==='am'?'오전':'오후')+' 위치'+(mv?` · 이동 ${mv}명`:'');
  $('#legend').innerHTML=on.length?on.map(m=>`<span style="--mc:var(${m.c})"><i></i><b>${m.name}</b> ${placeLabel(day[m.id])}</span>`).join(''):'<div class="empty" style="width:100%">이 날은 아직 입력된 위치가 없어요</div>';
}

function autoZoom(){const day=DB.days[sel]||{};const es=[];MEMBERS.forEach(m=>{const e=day[m.id];if(e){es.push(e);if(moved(e))es.push(e.pm)}});const inCap=es.length&&es.every(e=>{const c=COORD[locKey(e)];return c&&c[0]>=126.45&&c[0]<=127.75&&c[1]>=36.72&&c[1]<=37.98});zoom=inCap?'cap':'kr';document.querySelectorAll('#zoomSeg button').forEach(x=>x.classList.toggle('on',x.dataset.z===zoom))}

// 내용 보기 잠금 (작성은 누구나, 보기는 비밀번호)
const VIEW_PW='478';
let unlocked=false;
function unlockUI(box,onOk){
  box.innerHTML=`<div class="unl"><input type="password" inputmode="numeric" autocomplete="off" placeholder="비밀번호 입력" aria-label="내용 보기 비밀번호"><button>확인</button></div>`;
  const inp=box.querySelector('input'),btn=box.querySelector('button');
  const go=()=>{if(inp.value===VIEW_PW){unlocked=true;box.innerHTML='';renderLock();renderDay();onOk&&onOk();if($('#sheet').classList.contains('on'))applyMode();toast('전체 보기를 켰어요')}else{inp.classList.add('err');inp.value='';inp.placeholder='비밀번호가 달라요';}};
  btn.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};inp.focus();
}
function renderLock(){const b=$('#lockBtn');b.textContent=unlocked?'🔓 전체 보기 중':'🔒 전체 보기';b.classList.toggle('on',unlocked)}
$('#lockBtn').onclick=()=>{if(unlocked){unlocked=false;renderLock();renderDay();if($('#sheet').classList.contains('on'))closeSheet();toast('다시 잠갔어요');return}
  const box=$('#dpUnlock');if(box.innerHTML){box.innerHTML='';return}unlockUI(box)};
function setMemoField(e){
  const ta=$('#fMemo');$('#memoLock').innerHTML='';
  if(e&&!canSeeMemo(sel,cur.id)){ta.value='';ta.placeholder='🔒 내용이 잠겨 있어요'}
  else{ta.value=e?(e.memo||''):'';ta.placeholder=e&&MODE.k==='ro'?'작성한 내용이 없어요':'오전, 오후로 나눠서 어디 매매단지에 누구를 만나고 내용 아주 간략히 기재'}
  $('#ctr').textContent=ta.value.length;
}

// demo
// 저장소: claude.ai 아티팩트에서는 팀 공유 DB, 그 외(GitHub 등)에서는 이 기기 브라우저
let REMOTE=null,READONLY=false;
function setSync(k,t){const el=$('#sync');el.className='sync '+k;el.querySelector('span').textContent=t}
async function saveEntry(day,id,body){
  if(REMOTE){await REMOTE.collection('sched').doc(day+'_'+id).set(Object.assign({},body,{date:day,member:id,savedAt:Date.now()}));return}
  persist();
}
async function savePin(id,h){
  if(REMOTE){await REMOTE.collection('pins').doc(id).set({h,at:Date.now()});return}
  DB.pins=DB.pins||{};DB.pins[id]=h;persist();
}
async function removeEntry(day,id){
  if(REMOTE){await REMOTE.collection('sched').doc(day+'_'+id).delete();return}
  persist();
}
async function initRemote(){
  const use=window.claude&&window.claude.use;
  if(!use){setSync('warn','이 기기에만 저장돼요');return}
  let db=null;try{db=await window.claude.use('db')}catch(e){}
  if(!db){setSync('warn','이 기기에만 저장돼요');return}
  try{const u=await window.claude.use('user');if(u){const id=await u.id();if(id)MYID=id;const w=await u.can('data.write');if(w===false)READONLY=true;}}catch(e){}
  REMOTE=db;DB={days:{}};PINS={};renderAll();setSync('','팀 데이터 불러오는 중');
  const timer=setTimeout(()=>setSync('warn','팀 데이터 연결이 늦어지고 있어요'),10000);
  db.collection('pins').onSnapshot(snap=>{const p={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.h)p[d.id]=v.h});PINS=p;if($('#sheet').classList.contains('on')){}},()=>{});
  db.collection('sched').onSnapshot(snap=>{
    const days={};
    snap.docs.forEach(d=>{const v=d.data();if(!v||!v.date||!v.member)return;const e=Object.assign({},v);delete e.date;delete e.member;delete e.savedAt;(days[v.date]=days[v.date]||{})[v.member]=e});
    DB.days=days;renderAll();
    if(!snap.metadata.fromCache){clearTimeout(timer);setSync(READONLY?'warn':'ok',READONLY?'보기 전용 권한이에요 · 팀장에게 입력 권한 요청':'팀 공유 저장 중')}
  },()=>{clearTimeout(timer);setSync('err','팀 데이터 연결 오류 · 새로고침 해주세요')});
}
